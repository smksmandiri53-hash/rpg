
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09152b">
  <title>Mandiri Legends</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #09152b;
      color: white;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    #hud {
      position: fixed;
      z-index: 2;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      pointer-events: none;
    }

    .panel {
      background: rgba(8, 21, 43, 0.88);
      border: 1px solid #c9a94c;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 4px 20px #0005;
    }

    #playerPanel {
      width: 220px;
      max-width: 60%;
    }

    .gold {
      color: #ffd36a;
      font-weight: bold;
    }

    .bar {
      height: 9px;
      background: #394357;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
    }

    #health {
      width: 100%;
      height: 100%;
      background: #39d98a;
    }

    #xp {
      width: 0%;
      height: 100%;
      background: #58b9ff;
    }

    #message {
      position: fixed;
      z-index: 3;
      top: 145px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 10px;
      background: #09152be8;
      border: 1px solid #c9a94c;
      text-align: center;
      font-size: 13px;
      width: max-content;
      max-width: 90%;
    }

    #controls {
      position: fixed;
      z-index: 4;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      pointer-events: none;
    }

    .pad, #attack {
      pointer-events: auto;
      touch-action: none;
    }

    .pad {
      display: grid;
      grid-template-columns: 48px 48px 48px;
      grid-template-rows: 48px 48px 48px;
      gap: 4px;
    }

    .pad button, #attack {
      border: 1px solid #d9c477;
      color: white;
      background: #102747dc;
      border-radius: 13px;
      font-size: 20px;
      font-weight: bold;
    }

    .pad button:nth-child(1) {
      grid-column: 2;
    }

    .pad button:nth-child(2) {
      grid-column: 1;
      grid-row: 2;
    }

    .pad button:nth-child(3) {
      grid-column: 2;
      grid-row: 2;
    }

    .pad button:nth-child(4) {
      grid-column: 3;
      grid-row: 2;
    }

    .pad button:nth-child(5) {
      grid-column: 2;
      grid-row: 3;
    }

    #attack {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #a56c1d;
      font-size: 27px;
    }

    #attack small {
      display: block;
      font-size: 10px;
    }

    #footer {
      position: fixed;
      z-index: 2;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: #d4deeb;
      font-size: 10px;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (min-width: 800px) {
      #controls {
        opacity: 0.65;
      }

      #footer {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div id="playerPanel" class="panel">
      <div class="gold">⚔ MANDIRI LEGENDS</div>
      <div style="margin-top:7px">
        Hero: Ksatria Mandiri
      </div>
      <div>Level <span id="level">1</span></div>
      <div class="bar"><div id="health"></div></div>
      <div style="font-size:11px;margin-top:4px">
        HP: <span id="hpText">100</span>/100
      </div>
      <div class="bar"><div id="xp"></div></div>
      <div style="font-size:11px;margin-top:4px">
        XP: <span id="xpText">0</span>/100
      </div>
    </div>

    <div class="panel" style="text-align:right">
      <div class="gold">🪙 KOIN</div>
      <div id="coins" style="font-size:22px">0</div>
      <div style="margin-top:7px;font-size:12px">
        ⚔ Skor: <span id="score">0</span>
      </div>
    </div>
  </div>

  <div id="message">
    Jelajahi arena dan dekati monster latihan!
  </div>

  <div id="controls">
    <div class="pad">
      <button data-dir="up">▲</button>
      <button data-dir="left">◀</button>
      <button data-dir="center">•</button>
      <button data-dir="right">▶</button>
      <button data-dir="down">▼</button>
    </div>

    <button id="attack">⚔<small>ATTACK</small></button>
  </div>

  <div id="footer">
    WASD / Panah untuk bergerak • Spasi untuk menyerang
  </div>

  <script type="module">
    import * as THREE from
      'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const container = document.getElementById('game');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#8cc8ed');
    scene.fog = new THREE.Fog('#8cc8ed', 35, 100);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      250
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 1.7)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;

    container.appendChild(renderer.domElement);

    // Pencahayaan
    scene.add(new THREE.HemisphereLight(
      0xe4f4ff, 0x354a28, 2.1
    ));

    const sunlight = new THREE.DirectionalLight(
      0xffedc1, 3
    );

    sunlight.position.set(15, 25, 12);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(1024, 1024);
    scene.add(sunlight);

    // Material dunia
    const grassMat = new THREE.MeshStandardMaterial({
      color: 0x477d45,
      roughness: 1
    });

    const stoneMat = new THREE.MeshStandardMaterial({
      color: 0x8c9a9f,
      roughness: 0.9
    });

    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xffc94f,
      metalness: 0.55,
      roughness: 0.3
    });

    // Tanah arena
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(120, 120),
      grassMat
    );

    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Jalan batu
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(10, 100),
      new THREE.MeshStandardMaterial({
        color: 0x9d9b83,
        roughness: 1
      })
    );

    road.rotation.x = -Math.PI / 2;
    road.position.set(0, 0.025, -5);
    scene.add(road);

    // Membuat pohon sederhana
    function makeTree(x, z, scale = 1) {
      const tree = new THREE.Group();

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.25 * scale,
          0.38 * scale,
          2 * scale,
          7
        ),
        new THREE.MeshStandardMaterial({
          color: 0x704329
        })
      );

      trunk.position.y = scale;
      trunk.castShadow = true;
      tree.add(trunk);

      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.3 * scale, 3 * scale, 7),
        new THREE.MeshStandardMaterial({
          color: 0x286342,
          roughness: 1
        })
      );

      leaves.position.y = 3 * scale;
      leaves.castShadow = true;
      tree.add(leaves);

      tree.position.set(x, 0, z);
      scene.add(tree);
    }

    for (let i = 0; i < 65; i++) {
      const x = (Math.random() - 0.5) * 105;
      const z = (Math.random() - 0.5) * 105;

      if (Math.abs(x) < 8 && Math.abs(z) < 18) {
        continue;
      }

      makeTree(x, z, 0.7 + Math.random() * 0.7);
    }

    // Membuat hero
    const hero = new THREE.Group();

    const armorMat = new THREE.MeshStandardMaterial({
      color: 0x254c80,
      metalness: 0.65,
      roughness: 0.3
    });

    const body = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.48, 1.0, 4, 8),
      armorMat
    );

    body.position.y = 1.15;
    body.castShadow = true;
    hero.add(body);

    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.34, 16, 12),
      new THREE.MeshStandardMaterial({
        color: 0xd7a77b,
        roughness: 0.8
      })
    );

    head.position.y = 2.05;
    head.castShadow = true;
    hero.add(head);

    const helmet = new THREE.Mesh(
      new THREE.ConeGeometry(0.35, 0.65, 6),
      goldMat
    );

    helmet.position.y = 2.43;
    helmet.castShadow = true;
    hero.add(helmet);

    // Pedang
    const sword = new THREE.Mesh(
      new THREE.BoxGeometry(0.13, 1.2, 0.2),
      goldMat
    );

    sword.position.set(0.7, 1.25, -0.1);
    sword.rotation.z = -0.35;
    sword.castShadow = true;
    hero.add(sword);

    hero.position.set(0, 0, 8);
    scene.add(hero);

    // Monster latihan
    const monsters = [];

    function makeMonster(x, z) {
      const monster = new THREE.Group();

      const skin = new THREE.MeshStandardMaterial({
        color: 0x9b4350,
        roughness: 0.75
      });

      const torso = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.8, 1),
        skin
      );

      torso.position.y = 0.95;
      torso.castShadow = true;
      monster.add(torso);

      const eyeMat = new THREE.MeshBasicMaterial({
        color: 0xff392f
      });

      for (const side of [-1, 1]) {
        const eye = new THREE.Mesh(
          new THREE.SphereGeometry(0.09, 8, 8),
          eyeMat
        );

        eye.position.set(
          side * 0.22, 1.15, -0.65
        );

        monster.add(eye);
      }

      monster.position.set(x, 0, z);
      monster.userData.hp = 3;
      monster.userData.alive = true;

      scene.add(monster);
      monsters.push(monster);
    }

    makeMonster(4, -5);
    makeMonster(-5, -13);
    makeMonster(8, -22);
    makeMonster(-10, 2);

    // Status permainan
    const state = {
      hp: 100,
      xp: 0,
      level: 1,
      coins: 0,
      score: 0
    };

    const keys = {};
    const touch = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    function updateHUD() {
      document.getElementById('hpText').textContent =
        state.hp;

      document.getElementById('health').style.width =
        state.hp + '%';

      document.getElementById('level').textContent =
        state.level;

      document.getElementById('xpText').textContent =
        state.xp;

      document.getElementById('xp').style.width =
        state.xp + '%';

      document.getElementById('coins').textContent =
        state.coins;

      document.getElementById('score').textContent =
        state.score;
    }

    function showMessage(text) {
      document.getElementById('message').textContent =
        text;
    }

    // Serangan sederhana
    function attack() {
      let hit = false;

      for (const monster of monsters) {
        if (!monster.userData.alive) continue;

        const distance = hero.position.distanceTo(
          monster.position
        );

        if (distance < 3.3) {
          monster.userData.hp--;
          hit = true;

          monster.scale.setScalar(0.9);

          setTimeout(() => {
            if (monster.parent) {
              monster.scale.setScalar(1);
            }
          }, 120);

          if (monster.userData.hp <= 0) {
            monster.userData.alive = false;
            scene.remove(monster);

            state.xp += 35;
            state.coins += 10;
            state.score += 100;

            if (state.xp >= 100) {
              state.xp -= 100;
              state.level++;
              state.hp = 100;

              showMessage(
                'LEVEL UP! Kamu mencapai level ' +
                state.level + '!'
              );
            } else {
              showMessage(
                'Monster dikalahkan! +35 XP, +10 koin.'
              );
            }

            updateHUD();
          } else {
            showMessage(
              'Serangan mengenai monster! Sisa HP monster: ' +
              monster.userData.hp
            );
          }

          break;
        }
      }

      if (!hit) {
        showMessage(
          'Dekati monster terlebih dahulu untuk menyerang.'
        );
      }
    }

    window.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      keys[key] = true;

      if (
        ['arrowup', 'arrowdown', 'arrowleft',
         'arrowright', ' '].includes(key)
      ) {
        event.preventDefault();
      }

      if (key === ' ') attack();
    });

    window.addEventListener('keyup', event => {
      keys[event.key.toLowerCase()] = false;
    });

    document.querySelectorAll('[data-dir]').forEach(btn => {
      const dir = btn.dataset.dir;

      const start = event => {
        event.preventDefault();

        if (dir !== 'center') {
          touch[dir] = true;
        }
      };

      const stop = event => {
        event.preventDefault();

        if (dir !== 'center') {
          touch[dir] = false;
        }
      };

      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointercancel', stop);
      btn.addEventListener('pointerleave', stop);
    });

    document.getElementById('attack').addEventListener(
      'pointerdown',
      event => {
        event.preventDefault();
        attack();
      }
    );

    // Kamera mengikuti pemain
    const cameraOffset = new THREE.Vector3(0, 10, 13);
    const desiredCamera = new THREE.Vector3();

    let previousTime = 0;

    function animate(time) {
      requestAnimationFrame(animate);

      const dt = Math.min(
        (time - previousTime) / 1000 || 0,
        0.04
      );

      previousTime = time;

      let x = 0;
      let z = 0;

      if (keys.w || keys.arrowup || touch.up) z--;
      if (keys.s || keys.arrowdown || touch.down) z++;
      if (keys.a || keys.arrowleft || touch.left) x--;
      if (keys.d || keys.arrowright || touch.right) x++;

      if (x !== 0 || z !== 0) {
        const length = Math.hypot(x, z);
        x /= length;
        z /= length;

        hero.position.x += x * 7 * dt;
        hero.position.z += z * 7 * dt;

        hero.rotation.y = Math.atan2(x, z);
      }

      // Batas arena
      hero.position.x = THREE.MathUtils.clamp(
        hero.position.x, -55, 55
      );

      hero.position.z = THREE.MathUtils.clamp(
        hero.position.z, -55, 55
      );

      // Animasi idle ringan
      body.position.y =
        1.15 + Math.sin(time * 0.003) * 0.035;

      desiredCamera.copy(hero.position).add(cameraOffset);

      camera.position.lerp(desiredCamera, 1 - Math.exp(-5 * dt));
      camera.lookAt(
        hero.position.x,
        hero.position.y + 0.8,
        hero.position.z
      );

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.7)
      );

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });

    updateHUD();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
